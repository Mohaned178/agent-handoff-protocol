services:
  sglang:
    image: lmsysorg/sglang:v0.5.22
    container_name: ahp-sglang
    ports:
      - "8002:30000"
    volumes:
      - ahp-hf-cache:/root/.cache/huggingface
    ipc: host
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    command:
      - python3
      - -m
      - sglang.launch_server
      - --model-path
      - Qwen/Qwen2.5-Coder-7B-Instruct-AWQ
      - --host
      - 0.0.0.0
      - --port
      - "30000"
      - --context-length
      - "16384"
      - --mem-fraction-static
      - "0.85"
      - --tool-call-parser
      - qwen25
      - --random-seed
      - "0"

volumes:
  ahp-hf-cache:
    name: ahp-hf-cache
