services:
  vllm:
    image: vllm/vllm-openai:v0.32.0
    container_name: ahp-vllm
    ports:
      - "8001:8000"
    volumes:
      - ahp-hf-cache:/root/.cache/huggingface
    ipc: host
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    command:
      - --model
      - Qwen/Qwen2.5-Coder-7B-Instruct-AWQ
      - --quantization
      - awq_marlin
      - --max-model-len
      - "16384"
      - --gpu-memory-utilization
      - "0.90"
      - --enable-auto-tool-choice
      - --tool-call-parser
      - hermes
      - --seed
      - "0"

volumes:
  ahp-hf-cache:
    name: ahp-hf-cache
