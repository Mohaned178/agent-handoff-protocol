name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    # Core CI uses only the mock adapter: no coding-agent CLIs and no credentials.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: No known vulnerability in the published dependencies
        if: matrix.os == 'ubuntu-latest'
        run: npm audit --omit=dev
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
